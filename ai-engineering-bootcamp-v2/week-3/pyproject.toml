[project]
name = "week-3-session-3-agents"
version = "0.1.0"
description = "Session 3 ADK case-query agent — dual-answer client of week-1 over HTTP"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "streamlit>=1.35.0",
]

[tool.setuptools]
py-modules = [
    "agent",
    "tools",
    "ledger_store",
    "vocabulary",
    "cache_ledger",
    "run_query",
]
